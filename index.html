<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Girlfriend? 💕</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&family=Sacramento&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ffdeeb 0%, #fecdd3 50%, #fda4af 100%);
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .title-font {
            font-family: 'Fredoka One', cursive;
        }

        /* Floating background hearts animation */
        .bg-heart {
            position: absolute;
            color: rgba(244, 63, 94, 0.25);
            animation: floatUp 8s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Heartbeat Animation */
        .heart-beat {
            animation: heartbeat 1.2s infinite ease-in-out;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
        }

        /* Float wiggle for cat */
        .cat-bounce {
            animation: catBounce 3s ease-in-out infinite;
        }

        @keyframes catBounce {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }

        /* Button Glow & Hover Effects */
        .btn-yes {
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.5), 0 8px 10px -6px rgba(244, 63, 94, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-yes:hover {
            box-shadow: 0 15px 30px -5px rgba(244, 63, 94, 0.6), 0 10px 12px -5px rgba(244, 63, 94, 0.4);
        }

        .btn-no {
            transition: left 0.15s ease-out, top 0.15s ease-out;
            will-change: left, top;
            display: inline-block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(225, 29, 72, 0.15);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <div id="hearts-bg-container" class="fixed inset-0 pointer-events-none"></div>

    <main class="glass-card max-w-md w-full rounded-3xl p-6 md:p-8 text-center relative z-10 transition-all duration-500 my-auto">
        
        <!-- Header Tag / Special Badge -->
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-rose-100 border border-rose-200 rounded-full text-rose-600 text-sm font-semibold mb-4">
            <i class="fa-solid fa-heart text-rose-500"></i>
            <span>Special Question For You 💕</span>
        </div>

        <!-- Animated SVG Cat with Glowing Heart -->
        <div id="cat-wrapper" class="relative w-48 h-48 mx-auto my-2 cat-bounce flex items-center justify-center">
            <svg class="w-full h-full drop-shadow-md" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Cat Ears -->
                <path d="M50 85L30 35L80 60Z" fill="#FFAEC9" stroke="#E8759F" stroke-width="4" stroke-linejoin="round"/>
                <path d="M55 78L40 45L75 62Z" fill="#FFC8DD"/>
                <path d="M150 85L170 35L120 60Z" fill="#FFAEC9" stroke="#E8759F" stroke-width="4" stroke-linejoin="round"/>
                <path d="M145 78L160 45L125 62Z" fill="#FFC8DD"/>

                <!-- Cat Head & Body -->
                <ellipse cx="100" cy="100" rx="65" ry="55" fill="#FFE5EC" stroke="#E8759F" stroke-width="4"/>
                <path d="M55 130C55 160 75 180 100 180C125 180 145 160 145 130Z" fill="#FFE5EC" stroke="#E8759F" stroke-width="4"/>

                <!-- Cat Face Features -->
                <path d="M70 95C75 88 85 88 90 95" stroke="#4A3E3D" stroke-width="4" stroke-linecap="round"/>
                <path d="M110 95C115 88 125 88 130 95" stroke="#4A3E3D" stroke-width="4" stroke-linecap="round"/>

                <!-- Blushing Cheeks -->
                <ellipse cx="65" cy="105" rx="8" ry="5" fill="#FF85A1" opacity="0.7"/>
                <ellipse cx="135" cy="105" rx="8" ry="5" fill="#FF85A1" opacity="0.7"/>

                <!-- Nose & Mouth -->
                <polygon points="97,103 103,103 100,107" fill="#E8759F"/>
                <path d="M93 110C97 114 100 113 100 110C100 113 103 114 107 110" stroke="#4A3E3D" stroke-width="3" stroke-linecap="round"/>

                <!-- Paws Holding Heart -->
                <ellipse cx="72" cy="138" rx="12" ry="10" fill="#FFFFFF" stroke="#E8759F" stroke-width="3"/>
                <ellipse cx="128" cy="138" rx="12" ry="10" fill="#FFFFFF" stroke="#E8759F" stroke-width="3"/>
            </svg>

            <!-- Pulsing Glowing Heart in Cat's Paws -->
            <div id="glowing-heart" class="absolute bottom-6 heart-beat text-rose-500 drop-shadow-[0_0_15px_rgba(244,63,94,0.8)]">
                <i class="fa-solid fa-heart text-5xl"></i>
            </div>
        </div>

        <!-- Question Title -->
        <h1 id="main-title" class="title-font text-2xl md:text-3xl text-rose-600 mt-4 mb-2 leading-tight">
            Will you be my girlfriend? 💕
        </h1>
        <p id="sub-title" class="text-rose-400 font-semibold text-sm md:text-base mb-6">
            You make my world so much brighter! ✨
        </p>

        <!-- Interactive Action Area -->
        <div id="button-container" class="relative min-h-[120px] w-full flex items-center justify-center gap-6 mt-2">
            <!-- YES Button -->
            <button id="yes-btn" onclick="handleYesClick()" class="btn-yes px-8 py-3.5 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-extrabold text-lg rounded-2xl cursor-pointer transform active:scale-95 z-20">
                YES! 💖
            </button>

            <!-- NO Teleporting Button -->
            <button id="no-btn" onmouseover="teleportNoButton()" onclick="teleportNoButton()" ontouchstart="teleportNoButton(event)" class="btn-no px-6 py-3.5 bg-gray-200 text-gray-600 font-bold text-lg rounded-2xl cursor-pointer hover:bg-gray-300 z-50 select-none">
                No 😜
            </button>
        </div>

    </main>

    <script>
        function createBackgroundHearts() {
            const container = document.getElementById('hearts-bg-container');
            const heartIcons = ['fa-heart', 'fa-sparkles', 'fa-heart-pulse'];
            const colors = ['text-rose-400', 'text-pink-400', 'text-rose-300', 'text-pink-300'];

            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('i');
                const randomIcon = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                heart.className = `fa-solid ${randomIcon} bg-heart ${randomColor}`;
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDelay = `${Math.random() * 8}s`;
                heart.style.animationDuration = `${6 + Math.random() * 6}s`;
                heart.style.fontSize = `${14 + Math.random() * 20}px`;
                
                container.appendChild(heart);
            }
        }

        let noCount = 0;
        let isTeleportActive = false;
        const noPhrases = [
            "No 😜",
            "Are you sure? 🥺",
            "Really sure? 💔",
            "Think again! 🌸",
            "Last chance! 💖",
            "Surely not! 🙈",
            "You can't catch me! 🏃‍♂️",
            "Nice try! 😋"
        ];

        function teleportNoButton(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            const noBtn = document.getElementById('no-btn');
            
            if (!isTeleportActive) {
                noBtn.style.position = 'fixed';
                isTeleportActive = true;
            }

            const margin = 24;
            const btnWidth = noBtn.offsetWidth || 100;
            const btnHeight = noBtn.offsetHeight || 50;

            const minX = margin;
            const maxX = window.innerWidth - btnWidth - margin;
            const minY = margin;
            const maxY = window.innerHeight - btnHeight - margin;

            const randomX = Math.floor(minX + Math.random() * (maxX - minX));
            const randomY = Math.floor(minY + Math.random() * (maxY - minY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;

            noCount++;
            noBtn.innerText = noPhrases[noCount % noPhrases.length];

            const yesBtn = document.getElementById('yes-btn');
            const currentScale = 1 + (noCount * 0.08);
            if (currentScale < 1.7) {
                yesBtn.style.transform = `scale(${currentScale})`;
            }
        }

        document.addEventListener('pointermove', function(e) {
            const noBtn = document.getElementById('no-btn');
            if (!noBtn || !isTeleportActive && false) return;

            const rect = noBtn.getBoundingClientRect();
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;

            const distance = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);

            if (distance < 70) {
                teleportNoButton();
            }
        });

        function handleYesClick() {
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#f43f5e', '#ec4899', '#f472b6', '#fb7185', '#ffffff']
            });

            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                confetti({
                    particleCount: 8,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#f43f5e', '#ec4899']
                });
                confetti({
                    particleCount: 8,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#f43f5e', '#ec4899']
                });
            }, 200);

            const mainTitle = document.getElementById('main-title');
            const subTitle = document.getElementById('sub-title');
            const buttonContainer = document.getElementById('button-container');

            mainTitle.innerHTML = "Yay! I knew you'd say Yes! 💖🥰";
            subTitle.innerHTML = "You just made me the happiest person ever! I love you so much! ✨";

            buttonContainer.innerHTML = `
                <div class="bg-rose-100 border-2 border-rose-300 text-rose-600 rounded-2xl p-4 font-bold text-lg animate-bounce shadow-md">
                    Forever & Always! ❤️👩‍❤️‍👨
                </div>
            `;

            const heart = document.getElementById('glowing-heart');
            heart.className = "absolute bottom-6 text-rose-500 drop-shadow-[0_0_25px_rgba(244,63,94,1)] transform scale-150 transition-transform duration-300";
        }

        window.onload = function() {
            createBackgroundHearts();
        };
    </script>
</body>
</html>
